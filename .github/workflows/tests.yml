name: Pruebas
on:
  push:
    paths-ignore:
      - "vistos.json"           # estado que guarda el bot
      - "noticias_*.json"
      - "palabras_*.json"
      - "cola_x.json"           # publicaciones pendientes para X (panel de MP-Backend)
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
