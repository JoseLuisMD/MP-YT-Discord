name: Publicar noticias de videojuegos
on:
  workflow_dispatch:          # lo lanza cron-job.org o tú a mano

permissions:
  contents: write

concurrency:
  group: estado-repo

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar noticias
        id: publicar
        run: python -m noticias
        env:
          DISCORD_WEBHOOK_NOTICIAS: ${{ secrets.DISCORD_WEBHOOK_NOTICIAS }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Guardar noticias publicadas
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add noticias_*.json palabras_*.json cola_x.json   # archivos de noticias de todos los proyectos (proyectos.py) y la cola de X
          git diff --staged --quiet || (git commit -m "Actualizar noticias publicadas" && git pull --rebase && git push)
      - name: Actualizar las webs
        if: steps.publicar.outputs.webs != ''
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Falta el secreto WEB_TOKEN: las webs no se actualizan"; exit 0; fi
          for repo in $WEBS; do
            echo "Reconstruyendo $repo"
            gh workflow run web.yml --repo "$repo" --ref main
          done
        env:
          WEBS: ${{ steps.publicar.outputs.webs }}   # repos de las webs con noticias nuevas (clave "web" de proyectos.py)
          GH_TOKEN: ${{ secrets.WEB_TOKEN }}         # token con permiso Actions (lectura y escritura) en esos repos
