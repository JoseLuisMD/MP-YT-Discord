name: Publicar noticias de videojuegos
on:
  workflow_dispatch:          # lo lanza cron-job.org o tú a mano

permissions:
  contents: write

concurrency:
  group: estado-repo

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m noticias
        env:
          DISCORD_WEBHOOK_NOTICIAS: ${{ secrets.DISCORD_WEBHOOK_NOTICIAS }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Guardar noticias publicadas
        id: guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add noticias_publicadas.json noticias_web.json palabras_clave.json
          if git diff --staged --quiet; then
            echo "cambios=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualizar noticias publicadas" && git pull --rebase && git push
            echo "cambios=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Actualizar la web
        if: steps.guardar.outputs.cambios == 'true'
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Falta el secreto WEB_TOKEN: la web no se actualiza"; exit 0; fi
          gh workflow run web.yml --repo JoseLuisMD/MP-Website --ref main
        env:
          GH_TOKEN: ${{ secrets.WEB_TOKEN }}   # token con permiso Actions (lectura y escritura) en MP-Website
