name: Avisar videos nuevos a Discord
on:
  schedule:
    - cron: "15,45 * * * *"   # cada 30 minutos
  workflow_dispatch:          # permite lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: avisar

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python avisar.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Guardar videos vistos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vistos.json
          git diff --staged --quiet || (git commit -m "Actualizar vistos" && git push)
