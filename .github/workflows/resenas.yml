name: Avisar reseñas nuevas de Steam
on:
  workflow_dispatch:          # lo lanza cron-job.org (a las 21:00) o tú a mano

permissions:
  contents: write

concurrency:
  group: estado-repo

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer el estado (rama estado)
        run: bash .github/estado.sh traer
      - name: Avisar de las reseñas nuevas
        working-directory: estado   # el bot lee y escribe sus JSON en la carpeta del estado
        id: avisar
        run: python -m resenas
        env:
          PYTHONPATH: ${{ github.workspace }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Guardar reseñas vistas
        run: bash .github/estado.sh guardar "Actualizar reseñas vistas"
      - name: Actualizar las webs
        if: steps.avisar.outputs.webs != ''
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Falta el secreto WEB_TOKEN: las webs no se actualizan"; exit 0; fi
          for repo in $WEBS; do
            echo "Reconstruyendo $repo"
            gh workflow run web.yml --repo "$repo" --ref main
          done
        env:
          WEBS: ${{ steps.avisar.outputs.webs }}   # repos de las webs con reseñas nuevas (clave "web" de proyectos.py)
          GH_TOKEN: ${{ secrets.WEB_TOKEN }}       # token con permiso Actions (lectura y escritura) en esos repos
